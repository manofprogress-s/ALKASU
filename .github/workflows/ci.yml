name: CI

on:
  push:
    branches: ["**", "!ci-rapor"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Veritabanı testleri
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL istemcisi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migration + iş kuralı testleri
        run: bash scripts/test-db.sh

  app:
    name: Lint, tip kontrolü, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bağımlılıklar
        run: |
          mkdir -p ci-out
          if [ -f package-lock.json ]; then npm ci 2>&1 | tee ci-out/install.txt; else npm install --no-audit --no-fund 2>&1 | tee ci-out/install.txt; fi
          npm ls --depth=0 > ci-out/versions.txt 2>&1 || true
      - name: Kontroller
        id: checks
        run: |
          set +e
          fail=0
          run() { name=$1; shift; "$@" > "ci-out/$name.txt" 2>&1; c=$?; echo "$name: $c" >> ci-out/summary.txt; [ $c -ne 0 ] && fail=1; tail -40 "ci-out/$name.txt"; }
          run lint npm run lint
          run typecheck npm run typecheck
          run test npm run test
          run build npm run build
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          cat ci-out/summary.txt
      - name: Raporu ci-rapor dalına yaz
        if: always()
        run: |
          cp package-lock.json ci-out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > ci-out/sha.txt
          cd ci-out
          git init -q -b ci-rapor
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "CI raporu ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-rapor
      - name: Sonuç
        if: steps.checks.outputs.fail != '0'
        run: exit 1
      - name: Bağımlılık güvenlik denetimi
        run: npm audit --omit=dev --audit-level=high || true

  migrate:
    name: Migrationları uygula
    needs: [database, app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: supabase db push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "SUPABASE_DB_URL tanımlı değil; atlanıyor"; exit 0; fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
